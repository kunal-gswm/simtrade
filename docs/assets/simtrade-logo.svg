<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <title>SimTrade Logo</title>
  <desc>SimTrade paper trading platform brand mark</desc>
  <defs>
    <style>
      .text-sim { fill: #0F172A; }
      .text-sub { fill: #64748B; }
      @media (prefers-color-scheme: dark) {
        .text-sim { fill: #F8FAFC; }
        .text-sub { fill: #CBD5E1; }
      }
    </style>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Chart Bars -->
  <rect x="18" y="50" width="16" height="32" rx="3" fill="#CBD5E1"/>
  <rect x="40" y="38" width="16" height="44" rx="3" fill="#94A3B8"/>
  <rect x="62" y="22" width="16" height="60" rx="3" fill="url(#barGrad)"/>
  <!-- Trend Arrow -->
  <polyline points="26,68 48,50 70,30 92,12" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="78,12 92,12 92,26" fill="none" stroke="#16A34A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="118" y="62" class="text-sim" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" letter-spacing="-1">Sim</text>
  <text x="225" y="62" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#2563EB" letter-spacing="-1">Trade</text>
  <text x="120" y="84" class="text-sub" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="3">PAPER TRADING PLATFORM</text>
</svg>
