<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .panel { fill: #FFFFFF; rx: 12; stroke: #E2E8F0; stroke-width: 1; }
      .text-h1 { font-family: 'Inter', system-ui, sans-serif; font-size: 24px; font-weight: bold; fill: #0F172A; }
      .text-h2 { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #475569; }
      .text-val { font-family: 'Inter', system-ui, sans-serif; font-size: 32px; font-weight: bold; fill: #0F172A; }
      .text-green { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #16A34A; }
      .text-red { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #DC2626; }
      .chart-line { fill: none; stroke: #4F46E5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .btn-buy { fill: #16A34A; rx: 6; }
      .btn-sell { fill: #DC2626; rx: 6; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" class="bg" />
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="500" fill="#0F172A" />
  <circle cx="40" cy="50" r="16" fill="#4F46E5" />
  <text x="70" y="56" class="text-h2" fill="#FFFFFF">SimTrade</text>
  
  <rect x="20" y="100" width="160" height="40" rx="6" fill="#1E293B" />
  <text x="50" y="125" class="text-h2" fill="#E2E8F0">Dashboard</text>
  
  <text x="50" y="180" class="text-h2" fill="#94A3B8">Market</text>
  <text x="50" y="230" class="text-h2" fill="#94A3B8">Portfolio</text>
  <text x="50" y="280" class="text-h2" fill="#94A3B8">History</text>
  
  <!-- Main Content Area -->
  <!-- Top Bar -->
  <rect x="200" y="0" width="600" height="80" fill="#FFFFFF" />
  <text x="240" y="50" class="text-h1">Overview</text>
  
  <!-- Value Cards -->
  <!-- Portfolio Value -->
  <rect x="240" y="110" width="250" height="120" class="panel" />
  <text x="260" y="145" class="text-h2">Total Portfolio Value</text>
  <text x="260" y="190" class="text-val">$124,530.00</text>
  <text x="260" y="215" class="text-green">+ $2,450 (1.9%)</text>
  
  <!-- Available Cash -->
  <rect x="510" y="110" width="250" height="120" class="panel" />
  <text x="530" y="145" class="text-h2">Available Cash</text>
  <text x="530" y="190" class="text-val">$42,100.50</text>
  
  <!-- Chart Panel -->
  <rect x="240" y="250" width="520" height="220" class="panel" />
  <text x="260" y="285" class="text-h2">AAPL - Apple Inc.</text>
  <text x="260" y="315" class="text-val" font-size="24">$175.40</text>
  <text x="360" y="312" class="text-red">- $1.20 (0.68%)</text>
  
  <!-- Chart Grid & Line -->
  <line x1="260" y1="360" x2="720" y2="360" stroke="#F1F5F9" stroke-width="2" />
  <line x1="260" y1="400" x2="720" y2="400" stroke="#F1F5F9" stroke-width="2" />
  <line x1="260" y1="440" x2="720" y2="440" stroke="#F1F5F9" stroke-width="2" />
  
  <path d="M 260 420 L 320 370 L 380 400 L 460 310 L 520 330 L 600 280 L 680 340 L 720 320" class="chart-line" />
  
  <!-- Action Buttons -->
  <rect x="580" y="270" width="70" height="36" class="btn-buy" />
  <text x="615" y="293" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">Buy</text>
  
  <rect x="660" y="270" width="70" height="36" class="btn-sell" />
  <text x="695" y="293" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">Sell</text>
</svg>
