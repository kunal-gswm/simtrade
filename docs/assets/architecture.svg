<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 2; rx: 8; }
      .text-title { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .text-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; fill: #64748B; text-anchor: middle; }
      .line { fill: none; stroke: #CBD5E1; stroke-width: 2; stroke-dasharray: 4; }
      .arrow { fill: none; stroke: #2563EB; stroke-width: 3; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
  </defs>
  
  <rect width="600" height="300" class="bg" />
  
  <!-- UI Layer -->
  <rect x="50" y="40" width="160" height="80" class="box" stroke="#4F46E5" />
  <text x="130" y="80" class="text-title">Vaadin Flow UI</text>
  <text x="130" y="100" class="text-sub">Reactive /ui/*</text>
  
  <rect x="50" y="180" width="160" height="80" class="box" stroke="#0EA5E9" />
  <text x="130" y="220" class="text-title">Legacy Servlets/JSP</text>
  <text x="130" y="240" class="text-sub">Classic /app/*</text>
  
  <line x1="230" y1="80" x2="230" y2="220" class="line" />
  
  <!-- Service Layer -->
  <rect x="260" y="110" width="120" height="80" class="box" />
  <text x="320" y="150" class="text-title">Service Layer</text>
  <text x="320" y="170" class="text-sub">TradingService</text>
  
  <!-- DAO Layer -->
  <rect x="420" y="110" width="120" height="80" class="box" />
  <text x="480" y="150" class="text-title">DAO Layer</text>
  <text x="480" y="170" class="text-sub">JDBC Models</text>
  
  <!-- Arrows -->
  <path d="M 210 80 L 260 120" class="arrow" />
  <path d="M 210 220 L 260 180" class="arrow" />
  
  <line x1="380" y1="150" x2="415" y2="150" class="arrow" />
  
  <!-- Database -->
  <ellipse cx="480" cy="250" rx="40" ry="15" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" />
  <path d="M 440 250 L 440 270 A 40 15 0 0 0 520 270 L 520 250" fill="none" stroke="#16A34A" stroke-width="2" />
  <text x="480" y="260" class="text-title" font-size="14">MySQL 8+</text>
  
  <line x1="480" y1="190" x2="480" y2="230" class="arrow" />
</svg>
